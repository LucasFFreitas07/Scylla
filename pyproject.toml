[project]
name = "scylla"
version = "0.2.0"
description = "Ferramenta CLI para visualizar e matar processos (Linux)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "psutil>=7.2.2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.1",
]

[project.scripts]
scylla = "scylla.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
    "types-psutil>=7.2.2.20260518",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
